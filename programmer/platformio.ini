; ArduinoISP for the Trap PCB V3.3 "master" board — turns a working board into
; an ISP programmer for burning bootloaders on blank boards.
; Wiring: see docs/FLASHING.md + the two-board mapping diagram.
;   PIR 1/2/5/6 straight to target PIR 1/2/5/6 (5.1V, GND, SCK, MOSI)
;   PIR 4 (CS/D10) -> target RST button leg (reset drive)
;   chip leg 16 <-> chip leg 16 (MISO, held/tacked on both boards)
; IMPORTANT: unplug the DTR wire from Boot1 pin 1 while using the board as a
; programmer — otherwise avrdude resets ArduinoISP instead of driving the target.

[platformio]
default_envs = Upload_UART

[env:Upload_UART]
platform = atmelavr
framework = arduino
board = ATmega328P
board_build.f_cpu = 16000000L
build_unflags = -flto
upload_protocol = urclock
board_upload.speed = 115200
; upload_port = COM3
monitor_speed = 19200
