; PlatformIO configuration for the Project Mariehoene timelapse firmware.
; Based on the original Animal Detect arduino-controller config (MiniCore).
; https://github.com/MCUdude/MiniCore/blob/master/PlatformIO.md

[platformio]
default_envs = Upload_UART

[env]
platform = atmelavr
framework = arduino
lib_deps = lowpowerlab/LowPower_LowPowerLab@^2.2
board = ATmega328P
board_build.f_cpu = 16000000L
build_unflags = -flto
monitor_speed = 9600

; --- Everyday uploads over the Boot1 header (needs the bootloader from the
; --- fuses_bootloader env below, burned once per fresh chip).
; pio run -e Upload_UART -t upload
[env:Upload_UART]
upload_protocol = urclock
; Port autodetects; uncomment and adjust if it picks the wrong one:
; upload_port = COM5
board_upload.speed = ${env:fuses_bootloader.board_bootloader.speed}

; --- Full-flash upload over ISP (no bootloader needed), USBasp
; pio run -e Upload_ISP -t upload
[env:Upload_ISP]
upload_protocol = custom
upload_flags =
  -C$PROJECT_PACKAGES_DIR/tool-avrdude/avrdude.conf
  -p$BOARD_MCU
  -PUSB
  -cusbasp
upload_command = avrdude $UPLOAD_FLAGS -U flash:w:$SOURCE:i

; --- One-time per chip: set fuses + burn urboot bootloader with a USBasp.
; pio run -e fuses_bootloader -t bootloader
[env:fuses_bootloader]
board_hardware.oscillator = external ; 16 MHz crystal
board_bootloader.type = urboot
board_bootloader.speed = 115200
board_hardware.uart = uart0
board_hardware.bod = 2.7v
board_hardware.eesave = yes
upload_protocol = usbasp
upload_flags =
  -PUSB
  -B8                                ; slow ISP clock — fresh chips run at 1 MHz

; --- Same, but using an Arduino Uno running the ArduinoISP example sketch
; --- (Uno D10->RESET, D11->MOSI, D12->MISO, D13->SCK, 5V/GND).
; pio run -e fuses_bootloader_arduinoisp -t bootloader
[env:fuses_bootloader_arduinoisp]
board_hardware.oscillator = external
board_bootloader.type = urboot
board_bootloader.speed = 115200
board_hardware.uart = uart0
board_hardware.bod = 2.7v
board_hardware.eesave = yes
upload_protocol = stk500v1
upload_flags =
  -P$UPLOAD_PORT
  -b19200
; upload_port = COM4                 ; the Uno's port
